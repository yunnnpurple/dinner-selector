    if(n==="notfull") return f.tags.includes("notfull");
    if(n==="premium") return f.premium;
    if(n==="takeout") return f.takeout;
    return f.tags.includes(n);

        f.min > budgetMax ? (f.min-budgetMax)/40 : 0;
      const penalty=pricePenalty + Math.max(0,f.t-t)/10 + (di==="yes"&&!f.d?6:0);
      const matched=needs.filter(n=>matchesNeed(f,n)).length;
      return {f,matched,fav:isFavorite(f.name)?1:0,penalty,jitter:Math.random()};
    }).sort((a,b)=>a.penalty-b.penalty || b.fav-a.fav || b.matched-a.matched || a.jitter-b.jitter);
  }

  list=candidates.slice(0,20).map(x=>x.f);
  liked=[]; i=0;

  setup.classList.add("hidden");
  result.classList.add("hidden");
  match.classList.remove("hidden");
  document.getElementById("relaxNote")?.remove();

  // Existing page uses render() for cards.
  render();

  const note=document.createElement("div");
  note.id="relaxNote";
  note.style.cssText="margin-bottom:12px;padding:10px 12px;border-radius:12px;background:#fff6e9;border:1px solid #d8b999;color:#5a4638;font-size:14px";
  note.textContent=relaxed
    ? "💡 沒有完全符合主要條件的選項，已從資料庫找出最接近的 20 個給你挑。"
    : "✨ 已從 "+foods.length+" 種晚餐中，挑出最符合你條件的 "+list.length+" 個選項。";
  match.insertBefore(note,match.firstChild);
}
function render(){let f=list[i];card.innerHTML=`<button class="favorite-btn ${isFavorite(f.name)?"active":""}" 
      onclick="toggleFavorite('${f.name.replace(/'/g,"\\'")}')" 
      title="喜歡這個食物">${isFavorite(f.name)?"♥":"♡"}</button><div class="emoji">${f.e}</div><h2>${f.name}</h2><div class="details">💰 約 ${f.min}～${f.max} 元<br>⏱ 約 ${f.t} 分鐘<br>✨ ${f.desc}</div>`;count.textContent=`${i+1} / ${list.length}`}
function pick(y){if(y)liked.push(list[i]);i++;if(i<list.length)render();else finish()}
function finish(){
  match.classList.add("hidden");

  if(!liked.length){
    return show("😭 今天真的好難選！","你把所有選項都跳過了。");
  }

  // 第一輪留下超過 10 個：自動再進入一輪卡片淘汰。
  if(liked.length>10){
    list=[...liked];
    liked=[];
    i=0;
    result.classList.add("hidden");
    match.classList.remove("hidden");
    document.getElementById("relaxNote")?.remove();

    const note=document.createElement("div");
    note.id="relaxNote";
    note.style.cssText="margin-bottom:12px;padding:10px 12px;border-radius:12px;background:#fff6e9;border:1px solid #d8b999;color:#5a4638;font-size:14px";
    note.textContent="❤️ 你留下了 "+list.length+" 個選項，再選一輪，把今晚想吃的範圍縮小一點！";
    match.insertBefore(note,match.firstChild);
    render();
    return;
  }

  result.classList.remove("hidden");
  result.innerHTML=`
    <h2 style="text-align:center">❤️ 你最後留下的選項</h2>
    <p>現在可以自己做最後決定，或交給系統依照你一開始的條件幫你選。</p>
    <div id="finalChoices"></div>
    <button class="primary" style="margin-top:14px" onclick="helpChoose()">我不知道，你幫我選</button>`;

  const area=document.getElementById("finalChoices");
  liked.forEach((f,idx)=>{
    area.innerHTML += `
      <button onclick="finalPick(${idx})"
        style="margin-top:10px;background:#d9edf9;color:#5a4638;border:2px solid #9abfd4">
        ${f.e} ${f.name}｜${f.min}～${f.max} 元｜約 ${f.t} 分鐘
      </button>`;
  });
}

function finalPick(idx){
  showWinner(liked[idx], "這是你自己做的最終決定！");
}

function helpChoose(){
  // 不用純抽籤：依照原始條件為候選項目評分。
  const selectedTime=+time.value;
  const budgetRanges2={
    under100:[0,100],"100to150":[100,150],"150to200":[150,200],
    "200to300":[200,300],"300to500":[300,500],over500:[500,Infinity],unlimited:[0,Infinity]
  };
  const [selectedBudgetMin,selectedBudgetMax]=budgetRanges2[budget.value];
  const selectedNeeds=[...document.querySelectorAll("#need input:checked")].map(x=>x.value);
  const selectedDiet=diet.value;

  let scored=liked.map(f=>{
    let score=0;
    // 越符合預算與時間，分數越高。
    if(f.max>=selectedBudgetMin && f.min<=selectedBudgetMax) score += 3;
    if(f.t <= selectedTime) score += 2;
    if(selectedDiet==="yes" && f.d) score += 3;
    selectedNeeds.forEach(n=>{
      if(n==="nofried" && !f.fried) score += 3;
      else if(n==="notfull" && f.tags.includes("notfull")) score += 3;
      else if(n==="premium" && f.premium) score += 3;
      else if(n==="takeout" && f.takeout) score += 3;
      else if(f.tags.includes(n)) score += 3;
    });

    // 在同分時，以較省時間、較低價格作為小幅加分，避免最後完全隨機。
    score += Math.max(0, 1 - f.t/100);
    score += Math.max(0, 1 - f.min/500);
    return {f,score};
  });

  scored.sort((a,b)=>b.score-a.score);
  showWinner(scored[0].f, "依照你一開始設定的時間、預算、飲控與需求，這個選項最符合條件。");
}

function showWinner(w,reason){
  result.classList.remove("hidden");
  result.innerHTML=`
    <h2 style="text-align:center">🎉 今晚就吃這個！</h2>
    <div style="text-align:center;font-size:64px">${w.e}</div>
    <h2 style="text-align:center">${w.name}</h2>
    <p>💰 約 ${w.min}～${w.max} 元<br>⏱ 約 ${w.t} 分鐘</p>
    <p>${reason}</p>
    <button class="primary" onclick="reset()">重新開始</button>`;
}

function show(title,msg){result.classList.remove("hidden");result.innerHTML=`<h2 style="text-align:center">${title}</h2><p>${msg}</p><button class="primary" onclick="reset()">重新設定／再選一次</button>`}
function reset(){
  document.querySelectorAll("#need input").forEach(x=>x.checked=false);result.classList.add("hidden");match.classList.add("hidden");setup.classList.remove("hidden")}
</script></body></html>
